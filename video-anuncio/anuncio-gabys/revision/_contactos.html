<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#141414;font-family:Segoe UI,system-ui,sans-serif;padding:26px}
  h1{color:#C9A84C;font-size:26px;letter-spacing:.16em;text-transform:uppercase;
     text-align:center;margin-bottom:6px;font-weight:500}
  .sub{color:#7d7566;font-size:15px;text-align:center;margin-bottom:26px;letter-spacing:.06em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .cel{display:flex;flex-direction:column;align-items:center}
  .marco{width:360px;height:640px;overflow:hidden;border:1px solid #2f2f2f;position:relative;background:#0E0E0E}
  iframe{width:1080px;height:1920px;border:0;transform:scale(.3333);transform-origin:top left;position:absolute;top:0;left:0}
  .rot{color:#F0EAD6;font-size:17px;margin-top:12px;letter-spacing:.05em}
  .dur{color:#7d7566;font-size:14px;margin-top:3px}
</style></head><body>
  <h1>Anuncio Gaby's Fashion — Bocetos</h1>
  <div class="sub">6 cuadros &middot; 46 segundos &middot; vertical 1080&times;1920 &middot; sin animacion todavia</div>
  <div class="grid">
    <div class="cel"><div class="marco"><iframe src="01-apertura.html"></iframe></div><div class="rot">1 &middot; Apertura de marca</div><div class="dur">5 s</div></div>
    <div class="cel"><div class="marco"><iframe src="02-telefono.html"></iframe></div><div class="rot">2 &middot; El telefono entra</div><div class="dur">6 s</div></div>
    <div class="cel"><div class="marco"><iframe src="03-catalogo.html"></iframe></div><div class="rot">3 &middot; Catalogo y carrito</div><div class="dur">11 s</div></div>
    <div class="cel"><div class="marco"><iframe src="04-cuenta.html"></iframe></div><div class="rot">4 &middot; Tu cuenta</div><div class="dur">10 s</div></div>
    <div class="cel"><div class="marco"><iframe src="05-ofertas.html"></iframe></div><div class="rot">5 &middot; Ofertas y redes</div><div class="dur">10 s</div></div>
    <div class="cel"><div class="marco"><iframe src="06-cierre.html"></iframe></div><div class="rot">6 &middot; Cierre</div><div class="dur">4 s</div></div>
  </div>
</body></html>
