<!DOCTYPE html><html><head><meta charset="utf-8"><style>
 *{margin:0;padding:0}body{background:#141414;padding:18px;font-family:system-ui}
 h1{color:#C9A84C;font-size:22px;letter-spacing:.16em;text-transform:uppercase;text-align:center;margin-bottom:18px;font-weight:500}
 .g{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
 .m{width:100%;aspect-ratio:1080/1920;overflow:hidden;border:1px solid #2f2f2f;position:relative;background:#0E0E0E}
 iframe{width:1080px;height:1920px;border:0;transform-origin:top left;position:absolute;top:0;left:0}
 .t{color:#F0EAD6;font-size:12px;text-align:center;margin-top:7px;letter-spacing:.05em}
</style></head><body>
<h1>Anuncio — cuadros construidos</h1>
<div class="g">
 <div><div class="m"><iframe id="f1" src="../compositions/frames/01-apertura.html"></iframe></div><div class="t">1 · Apertura (3.8s)</div></div>
 <div><div class="m"><iframe id="f2" src="../compositions/frames/02-telefono.html"></iframe></div><div class="t">2 · Telefono (5.0s)</div></div>
 <div><div class="m"><iframe id="f3" src="../compositions/frames/03-catalogo.html"></iframe></div><div class="t">3 · Catalogo (5.0s)</div></div>
 <div><div class="m"><iframe id="f4" src="../compositions/frames/04-cuenta.html"></iframe></div><div class="t">4 · Cuenta (5.0s)</div></div>
 <div><div class="m"><iframe id="f5" src="../compositions/frames/05-ofertas.html"></iframe></div><div class="t">5 · Ofertas (6.0s)</div></div>
 <div><div class="m"><iframe id="f6" src="../compositions/frames/06-cierre.html"></iframe></div><div class="t">6 · Cierre (2.6s)</div></div>
</div>
<script>
 const at={f1:[1,3.8],f2:[2,5.0],f3:[3,5.0],f4:[4,5.0],f5:[5,6.0],f6:[6,2.6]};
 function escalar(){document.querySelectorAll('.m').forEach(m=>{const f=m.querySelector('iframe');f.style.transform='scale('+(m.clientWidth/1080)+')';});}
 window.addEventListener('load',()=>{ escalar(); setTimeout(()=>{ escalar();
   for (const [id,[n,t]] of Object.entries(at)) {
     try{ document.getElementById(id).contentWindow.__timelines['frame-0'+n].seek(t); }catch(e){ console.error(id,e.message); }
   }
 }, 3000); });
</script></body></html>
