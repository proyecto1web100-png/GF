<!DOCTYPE html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: #0E0E0E;
      }
      #root { position: relative; width: 100%; height: 100%; background: #0E0E0E; }
      /* Cada cuadro ocupa el lienzo completo; el solape entre uno y otro es lo
         que da el encadenado, asi que todos comparten la misma caja. */
      .cuadro { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- 60 fps: el giro del aparato y los recorridos dentro de la pantalla son
         movimientos rapidos sobre imagenes grandes; a 30 se ven a saltos. -->
    <!-- Tres cuadros. Las cuatro secciones de la demostracion viven dentro de
         un solo plano continuo para que el telefono no se reinicie entre una
         y otra. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.9"
         data-width="1080" data-height="1920" data-fps="60">

      <div id="c-01" class="cuadro clip" data-composition-id="frame-01"
           data-composition-src="compositions/frames/01-apertura.html"
           data-start="0"    data-duration="5"  data-track-index="0"></div>
      <div id="c-02" class="cuadro clip" data-composition-id="frame-demo"
           data-composition-src="compositions/frames/02-demo.html"
           data-start="4.55" data-duration="39" data-track-index="1"></div>
      <div id="c-03" class="cuadro clip" data-composition-id="frame-06"
           data-composition-src="compositions/frames/06-cierre.html"
           data-start="43.1" data-duration="2.8" data-track-index="2"></div>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
